<template>
  <style>
    @font-face { font-family: "Plus Jakarta Sans"; src: url("assets/fonts/PlusJakartaSans.ttf") format("truetype"); font-weight: 200 800; }
    #root { position: absolute; inset: 0; background: #0c2440; font-family: "Plus Jakarta Sans", sans-serif; overflow: hidden; }
    #s-mundo { position: absolute; inset: 0; transform-origin: 559px 989px; }
    #s-mundo img { position: absolute; left: -177px; top: 0; width: 1434px; height: 1920px; }
    #s-depois { position: absolute; inset: 0; clip-path: inset(0 0 0 1080px); }
    #s-linha { position: absolute; top: 0; bottom: 0; left: 0; width: 6px; margin-left: -3px; background: #fff; }
    #s-alca { position: absolute; left: 0; top: 1400px; width: 108px; height: 108px; margin: -54px 0 0 -54px; border-radius: 50%; background: #fff;
      display: grid; place-items: center; color: #0b9e96; font-size: 52px; font-weight: 800; box-shadow: 0 10px 30px rgba(12, 36, 64, 0.4); }
    .s-rot { position: absolute; top: 230px; padding: 14px 30px; border-radius: 99px; font-weight: 800; font-size: 40px; opacity: 0; }
    #s-antes { left: 60px; background: rgba(12, 36, 64, 0.88); color: #fff; }
    #s-depois-rot { right: 60px; background: #0b9e96; color: #fff; }
    #s-chip { position: absolute; left: 50%; top: 220px; white-space: nowrap; display: flex; align-items: center; gap: 16px;
      padding: 22px 36px; border-radius: 99px; background: #fff; color: #0c2440; font-weight: 800; font-size: 42px;
      box-shadow: 0 20px 50px -20px rgba(12, 36, 64, 0.6); }
    #s-chip i { width: 52px; height: 52px; border-radius: 50%; background: #0b9e96; color: #fff; font-style: normal; display: grid; place-items: center; font-size: 30px; }
  </style>
  <div id="root" data-composition-id="resultado" data-width="1080" data-height="1920">
    <div id="s-mundo">
      <img src="assets/img/rosto-antes.jpg" alt="" />
      <div id="s-depois"><img src="assets/img/rosto-depois.jpg" alt="" /></div>
      <div id="s-linha"></div>
    </div>
    <div id="s-alca">⇆</div>
    <div id="s-antes" class="s-rot">Antes</div>
    <div id="s-depois-rot" class="s-rot">Depois</div>
    <div id="s-chip"><i>✓</i>Só os dentes marcados mudam</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // a divisória do comparador anda junto com o recorte do "depois"
    const ZOOM = 2.4, OX = 559;
    const tela = x => OX + (x - OX) * ZOOM;                 // posição na tela de um x da foto depois do zoom
    // passadas seguintes: não gravam estado inicial (a primeira, logo abaixo, é a base)
    function divisoria(de, ate, t, dur, zoomFinal) {
      tl.fromTo("#s-depois", { clipPath: `inset(0 0 0 ${de}px)` }, { clipPath: `inset(0 0 0 ${ate}px)`, duration: dur, ease: "power2.inOut", immediateRender: false }, t);
      tl.fromTo("#s-linha", { x: de }, { x: ate, duration: dur, ease: "power2.inOut", immediateRender: false }, t);
      tl.fromTo("#s-alca", { x: zoomFinal ? tela(de) : de }, { x: zoomFinal ? tela(ate) : ate, duration: dur, ease: "power2.inOut", immediateRender: false }, t);
    }
    // o resultado aparece: a divisória varre do antes ao depois e volta ao meio
    tl.fromTo("#s-depois", { clipPath: "inset(0 0 0 1080px)" }, { clipPath: "inset(0 0 0 0px)", duration: 0.75, ease: "power2.inOut" }, 0.1);
    tl.fromTo("#s-linha", { x: 1080 }, { x: 0, duration: 0.75, ease: "power2.inOut" }, 0.1);
    tl.fromTo("#s-alca", { x: 1080 }, { x: 0, duration: 0.75, ease: "power2.inOut" }, 0.1);
    divisoria(0, 540, 1.05, 0.55);
    tl.fromTo(["#s-antes", "#s-depois-rot"], { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18 }, 1.4);
    // aproxima no sorriso: os dentes marcados mudaram, o resto ficou igual
    tl.to(["#s-antes", "#s-depois-rot"], { opacity: 0, duration: 0.15 }, 2.3);
    tl.fromTo("#s-mundo", { scale: 1, y: 0 }, { scale: ZOOM, y: -280, duration: 0.55, ease: "power3.inOut" }, 2.28);
    tl.fromTo("#s-alca", { x: 540, y: 0 }, { x: tela(540), y: 0, duration: 0.55, ease: "power3.inOut", immediateRender: false }, 2.28);
    tl.fromTo("#s-chip", { opacity: 0, scale: 0.6, xPercent: -50 }, { opacity: 1, scale: 1, xPercent: -50, duration: 0.35, ease: "back.out(1.6)" }, 2.98);
    divisoria(540, 470, 3.4, 0.5, true);
    divisoria(470, 615, 3.95, 0.6, true);
    divisoria(615, 540, 4.6, 0.45, true);
    // saída: mergulha no sorriso e some
    tl.to("#s-mundo", { scale: 2.9, filter: "blur(16px)", opacity: 0, duration: 0.25, ease: "power3.in" }, 5.25);
    tl.to(["#s-chip", "#s-alca"], { opacity: 0, duration: 0.15 }, 5.25);
    window.__timelines["resultado"] = tl;
  </script>
</template>
